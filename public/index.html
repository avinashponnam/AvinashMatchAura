<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avinash Match Aura</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 40px 25px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .status {
            margin-bottom: 25px;
            font-size: 15px;
        }

        .online {
            color: #7cff9b;
        }

        .start-btn {
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #667eea;
            transition: 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        .features {
            margin-top: 30px;
            text-align: left;
            line-height: 2;
            font-size: 15px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💫 Avinash Match Aura</h1>

        <p class="subtitle">
            Meet someone new. Talk freely. Stay connected.
        </p>

        <div class="status">
            🟢 <span class="online">Server Online</span>
        </div>

        <button class="start-btn" onclick="startChat()">
            🚀 Start Chat
        </button>

        <div class="features">
            <p>💬 Real-time stranger messaging</p>
            <p>🌍 Meet people online</p>
            <p>🔒 Privacy-focused chatting</p>
            <p>🚫 Block & report users</p>
        </div>

        <div class="footer">
            Avinash Match Aura © 2026
        </div>

    </div>

    <script>
    function startChat() {
        window.location.href = "login.html";
    }
</script>

</body>
</html>
